<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Render time, machine-readable and deliberately OUTSIDE the encrypted
     fragment. health_monitor.assess_dashboard_deploy compares this against the
     copy Vercel is actually serving to detect a push that never got deployed —
     the failure that silently hid daily_badshah's 23:00 result on 2026-07-02.
     It used to scrape the `new Date('...')` in the refresh-note script, which
     now ships encrypted; leaving it there would have switched that alarm off
     without a word. A timestamp discloses nothing the commit history doesn't. -->
<meta name="tm-rendered" content="2026-08-24T10:15:34Z">
<title>TradeMaster — Results Overview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:monospace;background:#111;color:#ddd;padding:24px}
h1{font-size:1.3em;color:#eee;margin-bottom:0}
.sub{color:#888;font-size:.82em;margin-bottom:32px}
/* Strategy cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-bottom:40px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;padding:20px;
       text-decoration:none;color:inherit;display:block;transition:border-color .15s}
.card:hover{border-color:#555}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.card-name{font-size:1.1em;font-weight:700;color:#eee}
.card-meta{font-size:.75em;color:#aaa;text-align:right;line-height:1.6}
.card-pnl{font-size:1.8em;font-weight:700;margin-bottom:12px}
.pos{color:#4caf50}.neg{color:#f44336}.neu{color:#aaa}
.card-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:.8em}
.stat-label{color:#999}
.stat-value{color:#ddd;text-align:right}
.card-footer{margin-top:14px;font-size:.75em;color:#888;border-top:1px solid #2a2a2a;padding-top:10px}
/* Comparison table */
h2{font-size:.9em;color:#aaa;margin-bottom:10px;border-bottom:1px solid #222;padding-bottom:6px}
.table-wrap{overflow-x:auto;margin-bottom:32px}
table{width:100%;border-collapse:collapse;font-size:.82em}
th{background:#161616;color:#aaa;padding:7px 10px;text-align:right;border-bottom:1px solid #2a2a2a;white-space:nowrap}
th:first-child{text-align:left}
td{padding:7px 10px;border-bottom:1px solid #1a1a1a;text-align:right;white-space:nowrap}
td:first-child{text-align:left}
td a{color:#64b5f6;text-decoration:none}
td a:hover{text-decoration:underline}
tr:hover td{background:#161616}
.updated{margin-top:24px;color:#555;font-size:.75em}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.quote{color:#ccc;font-size:.85em;text-align:right;max-width:55%;line-height:1.4;transition:opacity .6s ease}
.h2-row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #222;padding-bottom:6px;margin-bottom:10px}
.h2-row h2{border-bottom:none;padding-bottom:0;margin-bottom:0}
.note{color:#666;font-size:.75em}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:.75em;font-weight:600}
.b-done{background:#1b3a1b;color:#4caf50}
.b-partial{background:#2a2a1a;color:#ffb74d}
.b-active{background:#1a2a3a;color:#64b5f6}
.b-notrades{background:#252525;color:#888}
.b-none{background:#1a1a1a;color:#444}

/* Passcode gate — same shape as the per-strategy dashboards. */
#pw-gate{position:fixed;inset:0;background:#0d0d0d;display:flex;align-items:center;justify-content:center;z-index:9999}
#pw-gate.hidden{display:none}
.pw-box{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;padding:40px 36px;width:320px;text-align:center}
.pw-box p{color:#777;font-size:.8em;margin-bottom:22px}
.pw-box input{width:100%;background:#111;border:1px solid #333;border-radius:4px;padding:10px 12px;color:#ddd;font-family:monospace;font-size:.9em;outline:none;margin-bottom:12px}
.pw-box input:focus{border-color:#555}
.pw-box button{width:100%;background:#1e3a1e;border:1px solid #2a5a2a;border-radius:4px;color:#81c784;padding:10px;font-family:monospace;cursor:pointer;font-size:.9em}
.pw-box button:hover{background:#254825}
.pw-err{color:#f44336;font-size:.8em;margin-top:8px;min-height:1.2em}

/* Monthly income & ROI carousel */
.mr-wrap{background:#161616;border:1px solid #2a2a2a;border-radius:6px;
         padding:18px 20px 10px;margin-bottom:40px}
.mr-head{display:flex;justify-content:space-between;align-items:baseline;
         gap:16px;flex-wrap:wrap;margin-bottom:4px}
.mr-head h2{border-bottom:none;padding-bottom:0;margin-bottom:0}
.mr-basis{color:#666;font-size:.72em;line-height:1.5;max-width:440px;text-align:right}
.mr-bar{display:flex;align-items:center;gap:10px;margin:12px 0 6px;flex-wrap:wrap}
.mr-arrow{background:#1c1c1c;border:1px solid #333;border-radius:4px;color:#aaa;
          font-family:monospace;font-size:1em;line-height:1;padding:5px 11px;cursor:pointer}
.mr-arrow:hover{border-color:#555;color:#eee}
.mr-pills{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.mr-pill{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:3px;color:#888;
         font-family:monospace;font-size:.74em;padding:4px 9px;cursor:pointer;white-space:nowrap}
.mr-pill:hover{border-color:#555;color:#ccc}
.mr-pill.on{background:#1a2a3a;border-color:#2a4a6a;color:#64b5f6}
.mr-count{color:#555;font-size:.72em;white-space:nowrap}
.mr-panel{display:none}
.mr-panel.on{display:block}
.mr-title{color:#ddd;font-size:.9em;margin:6px 0 2px}
.mr-title .mr-sub{color:#666;font-size:.82em;margin-left:8px}
/* Run-rate tiles: what the monthly bars annualise to */
.mr-stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px;max-width:1040px}
.mr-stat{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:4px;
         padding:8px 14px;min-width:186px;flex:1}
.mr-stat-l{color:#777;font-size:.68em;text-transform:uppercase;letter-spacing:.05em}
.mr-stat-v{font-size:1.2em;font-weight:700;margin-top:3px}
.mr-stat-s{color:#555;font-size:.66em;margin-top:3px}
.mr-warn{color:#ffb74d;font-size:.68em;margin:2px 0 4px}
.mr-legend{display:flex;gap:18px;align-items:center;color:#888;font-size:.72em;margin:8px 0 2px}
.mr-key{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;
        vertical-align:-1px}
.mr-key + .mr-key{margin-left:2px}   /* 2px surface gap between adjacent fills */
.mr-key-line{width:16px;height:2px;border-radius:1px;background:#64b5f6}
.mr-key-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#64b5f6;
            margin:0 6px 0 -4px;vertical-align:-1px}
.mr-chart{position:relative;overflow-x:auto;margin-top:4px}
.mr-scroll{display:none;color:#555;font-size:.7em;margin-top:4px}
/* The viewBox scales EVERYTHING, text included, so an uncapped width turns a
   wide monitor into 28px axis labels and a 600px-tall chart. Cap it: past
   ~1040px the chart stops growing and the surrounding HTML type stays in
   proportion with it. */
.mr-svg{width:100%;max-width:1040px;min-width:620px;height:auto;display:block}
.mr-svg text{font-family:monospace}
.mr-tick{fill:#666;font-size:11px}
.mr-tick-roi{fill:#5a7fa0;font-size:11px}
/* Halo in the surface colour: a value label that lands on top of a bar fill has
   to stay legible without the bar giving up its own colour. */
.mr-val,.mr-roi-lab{paint-order:stroke;stroke:#161616;stroke-width:3px;
                    stroke-linejoin:round}
.mr-val{fill:#bbb;font-size:11px}
.mr-roi-lab{fill:#64b5f6;font-size:11px;font-weight:700}
.mr-xlab{fill:#888;font-size:12px}
.mr-axis-note{fill:#555;font-size:10px;letter-spacing:.05em}
.mr-hit{cursor:crosshair}
.mr-hit:hover{fill:#ffffff;fill-opacity:.03}
.mr-empty{color:#666;font-size:.8em;padding:28px 0}
.mr-table{margin:14px 0 6px;max-width:1040px}   /* match the chart's width cap */
.mr-table table{font-size:.78em}
.mr-mtd{font-size:.72em;color:#ffb74d;border:1px solid #3a3020;border-radius:3px;
        padding:0 4px;margin-left:5px}
.mr-tip{position:absolute;pointer-events:none;display:none;z-index:20;
        background:#0d0d0d;border:1px solid #333;border-radius:4px;padding:8px 11px;
        font-size:.74em;color:#ccc;line-height:1.7;white-space:nowrap;
        box-shadow:0 4px 14px rgba(0,0,0,.6)}
.mr-tip b{color:#eee}
.mr-tip .k{color:#666;margin-right:8px}
.mr-foot{color:#555;font-size:.7em;line-height:1.6;margin:6px 0 8px}
@media(max-width:760px){.mr-basis{max-width:100%;text-align:left}
                        .mr-scroll{display:block}}

</style>
</head>
<body>
<div id="pw-gate"><div class="pw-box"><p>Restricted access. Enter passcode</p><input id="pw-input" type="password" placeholder="" autofocus><button id="pw-submit">Unlock</button><div class="pw-err" id="pw-err"></div></div></div>
<div class="header-row">
<h1>TradeMaster &mdash; Results Overview</h1>
<p id="quote" class="quote"></p>
</div>
<div id="tm-content"></div>
<script>
(function(){
  var ENCRYPTED=true;  // true -> fetch + decrypt; false -> plaintext payload
  var ENCFILE="overview.enc";      // the encrypted fragment, a separate file
  var g=document.getElementById('pw-gate');
  var c=document.getElementById('tm-content');
  function runScripts(){
    // innerHTML does NOT execute <script> tags. The quote rotator, the refresh
    // note and the monthly-panel controls all live inside the encrypted
    // fragment, so each one has to be re-created to run at all.
    [].slice.call(c.querySelectorAll('script')).forEach(function(old){
      var s=document.createElement('script');
      s.textContent=old.textContent;
      document.body.appendChild(s);
    });
  }
  function reveal(html){
    c.innerHTML=html;
    if(g)g.classList.add('hidden');
    runScripts();
  }
  function fail(msg){
    c.innerHTML='<p style="color:#f44336;padding:24px 0">'+msg+'</p>';
    if(g)g.classList.add('hidden');
  }
  var envP=fetch(ENCFILE,{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('fetch '+r.status);return r.json();
  });
  if(!ENCRYPTED){
    envP.then(function(env){reveal(env.plain);})
        .catch(function(){fail('Failed to load overview data.');});
    return;
  }
  function b2u(s){return Uint8Array.from(atob(s),function(ch){return ch.charCodeAt(0);});}
  async function decryptWith(pw){
    var env=await envP;
    var salt=b2u(env.salt),iv=b2u(env.iv),ct=b2u(env.ct);
    var bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:salt,iterations:env.iter,hash:'SHA-256'},
      bk,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    return new TextDecoder().decode(pt);
  }
  var skey='tm_pw_'+location.pathname;
  async function check(){
    var inp=document.getElementById('pw-input');
    try{
      var html=await decryptWith(inp.value);
      sessionStorage.setItem(skey,inp.value);
      reveal(html);
    }catch(e){
      document.getElementById('pw-err').textContent='Incorrect passcode';
      inp.value='';
    }
  }
  document.getElementById('pw-submit').addEventListener('click',check);
  document.getElementById('pw-input').addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  var cached=sessionStorage.getItem(skey);
  if(cached){decryptWith(cached).then(reveal).catch(function(){sessionStorage.removeItem(skey);});}
})();
</script>
</body>
</html>
